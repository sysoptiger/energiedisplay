; Energiedisplay
; Board: Waveshare ESP32-S3-Touch-LCD-7 (Rev 1.2, ESP32-S3-WROOM-1 N16R8)

[env:energiedisplay]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB Flash, 8 MB Octal-PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl@8.3.11
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; Kabel steckt an der Buchse UART1, Schiebeschalter auf UART1
monitor_speed = 115200
upload_speed = 460800

; Update übers WLAN: OTA_PASSWORT aus config.h unten bei --auth eintragen.
; Dann links im PlatformIO-Bereich (Ameisenkopf) unter
; "energiedisplay-wlan" -> General -> Upload. Klappt der Name nicht, hier die
; IP vom Info-Screen eintragen, z. B. upload_port = 192.168.1.61
[env:energiedisplay-wlan]
extends = env:energiedisplay
upload_protocol = espota
upload_port = energiedisplay.local
upload_flags =
    --auth=ota-passwort

